name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pocker-linux-x86_64
            binary: pocker
          - name: Linux arm64
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: pocker-linux-arm64
            binary: pocker
          - name: macOS arm64
            runs_on: macos-latest
            target: aarch64-apple-darwin
            asset: pocker-macos-arm64
            binary: pocker
          - name: macOS x86_64
            runs_on: macos-15-intel
            target: x86_64-apple-darwin
            asset: pocker-macos-x86_64
            binary: pocker
          - name: Windows x64
            runs_on: windows-latest
            target: x86_64-pc-windows-msvc
            asset: pocker-windows-x86_64.exe
            binary: pocker.exe
          - name: Windows arm64
            runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: pocker-windows-arm64.exe
            binary: pocker.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

      - name: Upload install script
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh

  build-armv7:
    name: Build Linux armv7
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        run: cross build --locked --release --target armv7-unknown-linux-gnueabihf

      - name: Prepare release asset
        shell: bash
        run: |
          cp target/armv7-unknown-linux-gnueabihf/release/pocker \
            pocker-linux-armv7
          sha256sum pocker-linux-armv7 > pocker-linux-armv7.sha256

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pocker-linux-armv7
            pocker-linux-armv7.sha256
