name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: pocker-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            asset: pocker-aarch64-unknown-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            asset: pocker-armv7-unknown-linux-gnueabihf

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Prepare release asset
        run: |
          cp target/${{ matrix.target }}/release/pocker ${{ matrix.asset }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
