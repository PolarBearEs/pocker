name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-linux:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            glibc: "2.17"
            asset: pocker-linux-x86_64
          - name: Linux arm64
            target: aarch64-unknown-linux-gnu
            glibc: "2.17"
            asset: pocker-linux-arm64
          - name: Linux armv7
            target: armv7-unknown-linux-gnueabihf
            glibc: "2.17"
            asset: pocker-linux-armv7

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          shared-key: ${{ matrix.target }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build release binary
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Prepare release asset
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/pocker" "${{ matrix.asset }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runs_on: macos-latest
            target: aarch64-apple-darwin
            asset: pocker-macos-arm64
            binary: pocker
          - name: macOS x86_64
            runs_on: macos-15-intel
            target: x86_64-apple-darwin
            asset: pocker-macos-x86_64
            binary: pocker
          - name: Windows x64
            runs_on: windows-latest
            target: x86_64-pc-windows-msvc
            asset: pocker-windows-x86_64.exe
            binary: pocker.exe
          - name: Windows arm64
            runs_on: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: pocker-windows-arm64.exe
            binary: pocker.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.asset }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  upload-install-script:
    name: Upload install script
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload install script
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh
