name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  verify-linux:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runs_on: ubuntu-latest
            cache_key: linux-x86_64
          - name: Linux arm64
            runs_on: ubuntu-24.04-arm
            cache_key: linux-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          shared-key: ${{ matrix.cache_key }}

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build binary
        run: cargo build --locked

      - name: Run registry behavior smoke test
        run: ./ci/smoke-registry-behavior.sh target/debug/pocker

      - name: Run Docker smoke test
        run: ./ci/smoke-docker.sh target/debug/pocker

  verify-other:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runs_on: macos-latest
            cache_key: macos-arm64
          - name: macOS x86_64
            runs_on: macos-15-intel
            cache_key: macos-x86_64
          - name: Windows x64
            runs_on: windows-latest
            cache_key: windows-x64
          - name: Windows arm64
            runs_on: windows-11-arm
            cache_key: windows-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          shared-key: ${{ matrix.cache_key }}

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Build binary
        run: cargo build --locked

  build-armv7:
    runs-on: ubuntu-latest
    needs: fmt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          shared-key: armv7-unknown-linux-gnueabihf

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build armv7 binary with cross
        run: cross build --locked --target armv7-unknown-linux-gnueabihf
